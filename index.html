<!-- PLAY / PAUSE -->
<button class="ctrl" id="play" aria-label="Afspil eller pause">
  <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M9 6.15v11.7L18.4 12 9 6.15Z"/>
  </svg>

  <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true" style="display:none">
    <path d="M7.25 6h3.4v12h-3.4V6Zm6.1 0h3.4v12h-3.4V6Z"/>
  </svg>
</button>


<!-- HOME HEADER -->
<div class="home-title-wrap">
  <button
    id="home-player-back"
    type="button"
    aria-label="Tilbage til Spiller nu"
    title="Spiller nu"
  >
    <svg viewBox="0 0 24 24">
      <path d="M14.7 5.3 8 12l6.7 6.7-1.4 1.4L5.2 12l8.1-8.1 1.4 1.4Z"/>
    </svg>
  </button>

  <h1 class="home-greeting" id="home-greeting">God aften</h1>
</div>


<!-- SÆT DENNE IND SAMMEN MED PLAYLISTE / KØ KNAPPERNE -->
<div id="player-secondary-actions">
  <button id="playlist-button">☰ &nbsp; Vælg playliste</button>

  <button id="queue-button" type="button">
    ☷ &nbsp; Kø
  </button>

  <button
    id="transition-button"
    type="button"
    aria-haspopup="true"
    aria-expanded="false"
  >
    Overgang <span id="transition-value">Fra</span>
  </button>
</div>


<!-- SMOOTH OVERGANG MENU -->
<div id="transition-menu" aria-hidden="true">
  <div class="transition-menu-title">Smooth overgang</div>

  <button type="button" data-transition="0">Fra</button>
  <button type="button" data-transition="2">2 sek</button>
  <button type="button" data-transition="4">4 sek</button>
  <button type="button" data-transition="6">6 sek</button>
</div>


<style>
/* PLAY / PAUSE */

#play{
  width:68px !important;
  height:68px !important;

  padding:0 !important;

  display:grid !important;
  place-items:center !important;

  border:0 !important;
  border-radius:50% !important;

  background:#fff !important;
  color:#050505 !important;

  box-shadow:
    0 10px 28px rgba(0,0,0,.30) !important;

  cursor:pointer;

  transition:
    transform .16s ease,
    opacity .16s ease;
}

#play:hover{
  transform:scale(1.045);
}

#play:active{
  transform:scale(.96);
}

#play svg{
  width:29px !important;
  height:29px !important;

  fill:currentColor !important;
}

#play-icon{
  transform:translateX(1.5px);
}


/* HOME TILBAGE KNAP */

.home-title-wrap{
  display:flex;
  align-items:center;

  gap:12px;

  min-width:0;
}

#home-player-back{
  width:42px;
  height:42px;

  flex:none;

  padding:0;

  border:0;
  border-radius:50%;

  display:grid;
  place-items:center;

  background:rgba(0,0,0,.42);

  color:#fff;

  cursor:pointer;

  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);

  transition:
    background .16s ease,
    transform .16s ease;
}

#home-player-back:hover{
  background:rgba(255,255,255,.10);
}

#home-player-back:active{
  transform:scale(.94);
}

#home-player-back svg{
  width:22px;
  height:22px;

  fill:currentColor;
}


/* PLAYLISTE / KØ / OVERGANG */

#player-secondary-actions{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-wrap:wrap;

  gap:8px;

  margin-top:16px;
}

#player-secondary-actions button{
  min-height:38px;

  margin:0;

  padding:9px 14px;

  border:0;
  border-radius:999px;

  background:transparent;

  color:rgba(255,255,255,.82);

  font-weight:700;

  cursor:pointer;

  transition:
    background .16s ease,
    transform .16s ease;
}

#player-secondary-actions button:hover{
  background:rgba(255,255,255,.07);
}

#player-secondary-actions button:active{
  transform:scale(.96);
}


/* OVERGANG */

#transition-value{
  margin-left:4px;

  color:var(--accent);
}

#transition-menu{
  position:absolute;

  right:0;
  bottom:52px;

  z-index:75;

  width:190px;

  padding:8px;

  border:
    1px solid rgba(255,255,255,.11);

  border-radius:15px;

  background:
    rgba(14,14,14,.96);

  box-shadow:
    0 20px 48px rgba(0,0,0,.40);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  opacity:0;

  pointer-events:none;

  transform:
    translateY(8px)
    scale(.98);

  transition:
    opacity .18s ease,
    transform .22s ease;
}

#transition-menu.open{
  opacity:1;

  pointer-events:auto;

  transform:
    translateY(0)
    scale(1);
}

.transition-menu-title{
  padding:
    8px 10px 7px;

  color:var(--muted);

  font-size:11px;
  font-weight:800;
}

#transition-menu button{
  width:100%;
  min-height:40px;

  padding:
    0 11px;

  border:0;
  border-radius:10px;

  text-align:left;

  background:transparent;

  color:#fff;

  font-weight:700;

  cursor:pointer;
}

#transition-menu button:hover{
  background:
    rgba(255,255,255,.07);
}

#transition-menu button.active{
  color:var(--accent);

  background:
    rgba(29,185,84,.10);
}


/* SMOOTH VISUELT SANGSKIFT */

#album-wrap{
  transition:
    transform .72s cubic-bezier(.22,.72,.25,1),
    opacity .26s ease,
    filter .45s ease,
    box-shadow .45s ease !important;
}

body.smooth-track-change #album-wrap{
  transform:
    scale(.965) !important;

  opacity:.72;
}

#title,
#artist{
  transition:
    opacity .24s ease,
    transform .32s ease;
}

body.smooth-track-change #title,
body.smooth-track-change #artist{
  opacity:.45;

  transform:
    translateY(4px);
}


@media(max-width:760px){

  .home-title-wrap{
    gap:9px;
  }

  #home-player-back{
    width:40px;
    height:40px;
  }

  #transition-menu{
    right:auto;
    left:50%;

    transform:
      translate(-50%,8px)
      scale(.98);
  }

  #transition-menu.open{
    transform:
      translate(-50%,0)
      scale(1);
  }
}
</style>


<script>
(() => {

  const byId = id =>
    document.getElementById(id);



  /* =========================================
     HOME -> SPILLER NU
     ========================================= */

  byId("home-player-back")
    ?.addEventListener(
      "click",
      event => {

        event.preventDefault();
        event.stopPropagation();

        if(
          typeof speakerfyPlayer
          === "function"
        ){
          speakerfyPlayer();
          return;
        }

        [
          "screen-home",
          "screen-settings",
          "screen-search",
          "screen-liked",
          "screen-queue"
        ].forEach(id => {

          byId(id)
            ?.classList
            .remove("active");

        });

        try{
          el.overlay
            .classList
            .remove("open");
        }catch{}

        try{
          wakeScreen();
        }catch{}

      }
    );



  /* =========================================
     SMOOTH OVERGANG
     ========================================= */

  const allowedTransitions =
    [
      0,
      2,
      4,
      6
    ];


  let smoothSeconds =
    Number(
      localStorage.getItem(
        "speakerfy_smooth_transition"
      ) || 0
    );


  if(
    !allowedTransitions
      .includes(smoothSeconds)
  ){
    smoothSeconds = 0;
  }


  let listenerAttached = false;

  let playerPaused = true;

  let currentTrackUri = "";

  let fadingOut = false;
  let fadingIn = false;

  let baseVolume = .6;

  let fadeTimer = null;

  let fadeTriggeredTrack = "";



  /* =========================================
     MENU
     ========================================= */

  function updateTransitionUI(){

    const value =
      byId("transition-value");


    if(value){

      value.textContent =
        smoothSeconds
          ? `${smoothSeconds}s`
          : "Fra";

    }


    document
      .querySelectorAll(
        "#transition-menu [data-transition]"
      )
      .forEach(button => {

        button
          .classList
          .toggle(
            "active",
            Number(
              button.dataset.transition
            ) === smoothSeconds
          );

      });

  }



  function closeTransitionMenu(){

    const menu =
      byId("transition-menu");

    menu
      ?.classList
      .remove("open");

    menu
      ?.setAttribute(
        "aria-hidden",
        "true"
      );

    byId("transition-button")
      ?.setAttribute(
        "aria-expanded",
        "false"
      );

  }



  byId("transition-button")
    ?.addEventListener(
      "click",
      event => {

        event.preventDefault();
        event.stopPropagation();

        const menu =
          byId("transition-menu");

        const open =
          menu
            ?.classList
            .toggle("open");


        menu
          ?.setAttribute(
            "aria-hidden",
            open
              ? "false"
              : "true"
          );


        byId("transition-button")
          ?.setAttribute(
            "aria-expanded",
            open
              ? "true"
              : "false"
          );

      }
    );



  document
    .querySelectorAll(
      "#transition-menu [data-transition]"
    )
    .forEach(button => {

      button
        .addEventListener(
          "click",
          event => {

            event.preventDefault();
            event.stopPropagation();


            smoothSeconds =
              Number(
                button.dataset.transition
              ) || 0;


            localStorage.setItem(
              "speakerfy_smooth_transition",
              String(smoothSeconds)
            );


            updateTransitionUI();

            closeTransitionMenu();


            if(
              typeof speakerfyToast
              === "function"
            ){

              speakerfyToast(

                smoothSeconds
                  ? "Smooth overgang slået til"
                  : "Smooth overgang slået fra",

                smoothSeconds
                  ? `Fade mellem numrene over ca. ${smoothSeconds} sekunder.`
                  : "Normal overgang igen.",

                2600

              );

            }

          }
        );

    });



  document
    .addEventListener(
      "click",
      event => {

        if(
          !event.target.closest(
            "#transition-menu"
          )
          &&
          !event.target.closest(
            "#transition-button"
          )
        ){

          closeTransitionMenu();

        }

      }
    );


  updateTransitionUI();



  /* =========================================
     VOLUME FADE
     ========================================= */

  function clearFade(){

    if(fadeTimer){

      clearInterval(
        fadeTimer
      );

      fadeTimer = null;

    }

  }



  async function getCurrentVolume(){

    try{

      const volume =
        await spotifyPlayer
          ?.getVolume?.();


      if(
        Number.isFinite(volume)
      ){

        return Math.max(
          0,
          Math.min(
            1,
            volume
          )
        );

      }

    }catch{}


    return baseVolume;

  }



  async function fadeVolume(
    from,
    to,
    durationMs
  ){

    clearFade();


    if(
      !spotifyPlayer?.setVolume
    ){
      return;
    }


    const steps =
      Math.max(
        8,
        Math.round(
          durationMs / 90
        )
      );


    let step = 0;


    try{

      await spotifyPlayer
        .setVolume(from);

    }catch{}


    return new Promise(
      resolve => {

        fadeTimer =
          setInterval(
            async () => {

              step++;


              const progress =
                Math.min(
                  1,
                  step / steps
                );


              const eased =
                progress *
                progress *
                (
                  3 -
                  2 * progress
                );


              const volume =
                from +
                (
                  to - from
                ) *
                eased;


              try{

                await spotifyPlayer
                  .setVolume(
                    Math.max(
                      0,
                      Math.min(
                        1,
                        volume
                      )
                    )
                  );

              }catch{}


              if(
                progress >= 1
              ){

                clearFade();

                resolve();

              }

            },

            Math.max(
              55,
              Math.round(
                durationMs /
                steps
              )
            )

          );

      }
    );

  }



  /* =========================================
     FADE OUT
     ========================================= */

  async function fadeOut(){

    if(
      !smoothSeconds ||
      fadingOut ||
      fadingIn ||
      playerPaused ||
      !spotifyPlayer
    ){
      return;
    }


    fadingOut = true;

    fadeTriggeredTrack =
      currentTrackUri;


    baseVolume =
      await getCurrentVolume();


    const fadeTime =
      Math.max(
        550,
        smoothSeconds * 500
      );


    await fadeVolume(
      baseVolume,
      .03,
      fadeTime
    );

  }



  /* =========================================
     FADE IN
     ========================================= */

  async function fadeIn(){

    if(
      !spotifyPlayer
    ){

      fadingOut = false;
      fadingIn = false;

      return;

    }


    fadingIn = true;
    fadingOut = false;


    document.body
      .classList
      .add(
        "smooth-track-change"
      );


    try{

      await spotifyPlayer
        .setVolume(.03);

    }catch{}


    const fadeTime =
      Math.max(
        550,
        smoothSeconds * 500
      );


    await fadeVolume(
      .03,
      baseVolume,
      fadeTime
    );


    fadingIn = false;


    setTimeout(
      () => {

        document.body
          .classList
          .remove(
            "smooth-track-change"
          );

      },
      120
    );

  }



  /* =========================================
     SPOTIFY TRACK CHANGE
     ========================================= */

  function attachPlayerListener(){

    if(
      listenerAttached ||
      !spotifyPlayer
    ){
      return;
    }


    listenerAttached = true;


    spotifyPlayer
      .addListener(
        "player_state_changed",
        state => {

          if(!state){
            return;
          }


          playerPaused =
            Boolean(
              state.paused
            );


          const uri =
            state
              .track_window
              ?.current_track
              ?.uri
            || "";


          if(
            currentTrackUri &&
            uri &&
            uri !== currentTrackUri
          ){

            const hadFade =
              fadingOut ||
              fadeTriggeredTrack
                === currentTrackUri;


            currentTrackUri =
              uri;


            fadeTriggeredTrack =
              "";


            if(
              smoothSeconds > 0 &&
              hadFade
            ){

              fadeIn();

            }else{

              document.body
                .classList
                .add(
                  "smooth-track-change"
                );


              setTimeout(
                () => {

                  document.body
                    .classList
                    .remove(
                      "smooth-track-change"
                    );

                },
                380
              );

            }

          }else if(uri){

            currentTrackUri =
              uri;

          }


          if(
            playerPaused &&
            fadingOut
          ){

            clearFade();

            fadingOut = false;


            spotifyPlayer
              .setVolume(
                baseVolume
              )
              .catch(
                () => {}
              );

          }

        }
      );

  }



  /* =========================================
     CHECK SONG END
     ========================================= */

  setInterval(
    () => {

      attachPlayerListener();


      if(
        !smoothSeconds ||
        playerPaused ||
        fadingOut ||
        fadingIn ||
        !currentTrackUri
      ){
        return;
      }


      try{

        const remaining =
          duration -
          position;


        const fadeWindow =
          Math.max(
            550,
            smoothSeconds * 500
          );


        if(
          duration > 0 &&
          remaining > 0 &&
          remaining <= fadeWindow &&
          fadeTriggeredTrack
            !== currentTrackUri
        ){

          fadeOut();

        }

      }catch{}

    },
    180
  );



  /* =========================================
     RESTORE VOLUME IF DISABLED
     ========================================= */

  setInterval(
    () => {

      if(
        smoothSeconds === 0 &&
        (
          fadingOut ||
          fadingIn
        )
      ){

        clearFade();

        fadingOut = false;
        fadingIn = false;


        spotifyPlayer
          ?.setVolume?.(
            baseVolume
          )
          .catch(
            () => {}
          );

      }

    },
    350
  );

})();
</script>
