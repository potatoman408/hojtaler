<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Højtaler</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080808;
  --panel:#171717;
  --panel2:#222;
  --fg:#f5f5f5;
  --dim:#999;
  --green:#1ed760;
  --line:rgba(255,255,255,.09);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#080808;
  color:var(--fg);
  font-family:"Space Grotesk",sans-serif;
  overflow:hidden;
  user-select:none;
}

body{
  background:
    radial-gradient(
      circle at 50% 20%,
      #292929 0,
      #111 38%,
      #070707 75%
    );
}

#bg{
  position:fixed;
  inset:-10%;
  background-size:cover;
  background-position:center;
  filter:blur(70px) saturate(1.25) brightness(.35);
  transform:scale(1.15);
  opacity:.75;
  z-index:0;
  transition:background-image .8s ease;
}

#shade{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.42);
  z-index:1;
}

button{
  font:inherit;
}

/* =========================
   APP
========================= */

#app{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  padding:24px 30px;
  overflow:auto;
  scrollbar-width:none;
}

#app::-webkit-scrollbar{
  display:none;
}

/* =========================
   TOP BAR
========================= */

#topbar{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  max-width:1050px;
  margin:0 auto 14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  font-size:18px;
}

.spotify-dot{
  width:12px;
  height:12px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 15px rgba(30,215,96,.35);
}

#clock{
  color:#aaa;
  font-size:14px;
}

/* =========================
   LOGIN
========================= */

#login{
  height:calc(100vh - 100px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.login-card{
  max-width:440px;
  background:rgba(25,25,25,.85);
  border:1px solid var(--line);
  border-radius:32px;
  padding:42px 34px;
  backdrop-filter:blur(25px);
}

.login-card h1{
  font-size:32px;
  margin:0 0 12px;
}

.login-card p{
  color:#aaa;
  line-height:1.5;
  margin:0 0 25px;
}

.primary{
  background:var(--fg);
  color:#111;
  border:0;
  border-radius:999px;
  padding:15px 25px;
  font-weight:600;
  cursor:pointer;
}

/* =========================
   PLAYER
========================= */

#player{
  display:none;
  max-width:1050px;
  margin:auto;
}

.carplay-main{
  display:grid;
  grid-template-columns:minmax(300px,430px) minmax(340px,1fr);
  gap:38px;
  align-items:center;
}

#art-wrap{
  width:min(100%,430px);
  aspect-ratio:1;
  border-radius:28px;
  overflow:hidden;
  background:#111;
  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.06);
  margin:auto;
}

#art{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* =========================
   TRACK INFO
========================= */

#meta{
  margin:0 0 22px;
}

#title{
  font-size:clamp(25px,3vw,38px);
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#artist{
  font-size:18px;
  color:#aaa;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   CONTROL PANEL
========================= */

.glass{
  background:rgba(27,27,27,.82);
  border:1px solid var(--line);
  border-radius:28px;
  padding:24px;
  backdrop-filter:blur(22px);
}

#progress-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.time{
  font-size:12px;
  color:#aaa;
  width:38px;
}

#time-dur{
  text-align:right;
}

#bar{
  height:6px;
  flex:1;
  background:#4b4b4b;
  border-radius:99px;
  cursor:pointer;
  position:relative;
}

#bar-fill{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0;
  background:var(--fg);
  border-radius:99px;
}

/* =========================
   BUTTONS
========================= */

#controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:35px;
  margin:25px 0 8px;
}

.ctrl{
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:#303030;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:.15s;
}

.ctrl:active{
  transform:scale(.92);
}

#play-pause{
  width:76px;
  height:76px;
  background:var(--fg);
  color:#111;
}

#btn-playlists{
  margin-top:18px;
  width:100%;
  height:54px;
  border:0;
  border-radius:18px;
  background:#303030;
  color:white;
  font-weight:600;
  cursor:pointer;
}

#btn-playlists:active{
  background:#3b3b3b;
}

/* =========================
   VOLUME
========================= */

#volume-side{
  position:fixed;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  height:260px;
  width:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:4;
  touch-action:none;
}

#vol-track{
  width:7px;
  height:100%;
  background:#414141;
  border-radius:99px;
  position:relative;
}

#vol-side-fill{
  position:absolute;
  bottom:0;
  width:100%;
  height:60%;
  background:var(--green);
  border-radius:99px;
}

#vol-side-fill:after{
  content:"";
  position:absolute;
  top:-5px;
  left:50%;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#fff;
  transform:translateX(-50%);
}

/* =========================
   FULLSCREEN
========================= */

#btn-fullscreen{
  position:fixed;
  right:20px;
  top:20px;
  z-index:5;
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid var(--line);
  background:#202020;
  color:white;
  cursor:pointer;
}

/* =========================
   PLAYLIST OVERLAY
========================= */

#playlist-overlay{
  position:fixed;
  inset:0;
  z-index:10;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(28px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}

#playlist-overlay.open{
  opacity:1;
  pointer-events:auto;
}

#playlist-panel{
  width:min(900px,100%);
  max-height:88vh;
  background:#151515;
  border:1px solid var(--line);
  border-radius:30px 30px 0 0;
  padding:20px 22px 30px;
  transform:translateY(30px);
  transition:.35s;
  overflow:auto;
}

#playlist-overlay.open #playlist-panel{
  transform:translateY(0);
}

#playlist-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
  position:sticky;
  top:0;
  background:#151515;
  z-index:2;
  padding-bottom:8px;
}

#playlist-title{
  font-size:21px;
  margin:0;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.round{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#292929;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:25px;
}

/* =========================
   PLAYLIST GRID
========================= */

#playlist-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(145px,1fr));
  gap:14px;
}

.pl-item{
  background:#202020;
  border-radius:20px;
  padding:10px;
  cursor:pointer;
  transition:.15s;
}

.pl-item:active{
  transform:scale(.97);
}

.pl-item img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:14px;
  background:#292929;
}

.pl-item span{
  display:block;
  margin:9px 3px 2px;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   TRACK LIST
========================= */

#track-list{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.play-all-btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:16px;
  background:var(--green);
  color:#06130a;
  font-weight:700;
  margin-bottom:9px;
  cursor:pointer;
}

.track-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px;
  border-radius:17px;
  cursor:pointer;
  border:1px solid transparent;
}

.track-row:active{
  background:#252525;
}

.track-row.playing{
  background:#252525;
  border-color:rgba(30,215,96,.28);
}

.track-row img{
  width:55px;
  height:55px;
  border-radius:11px;
  object-fit:cover;
  background:#222;
  flex-shrink:0;
}

.t-meta{
  min-width:0;
  flex:1;
}

.t-title{
  display:block;
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.t-artist{
  display:block;
  font-size:13px;
  color:#999;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.track-state{
  color:var(--green);
  font-size:18px;
  width:25px;
  text-align:center;
}

/* =========================
   STATUS
========================= */

#status{
  position:fixed;
  bottom:12px;
  left:0;
  width:100%;
  text-align:center;
  color:#777;
  font-size:11px;
  z-index:4;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  #app{
    padding:16px 18px 25px;
  }

  .carplay-main{
    grid-template-columns:1fr;
    gap:22px;
  }

  #art-wrap{
    width:min(72vw,360px);
  }

  #meta{
    text-align:center;
  }

  #volume-side{
    right:2px;
    height:190px;
  }
}

/* =========================
   LANDSCAPE
========================= */

@media(max-height:650px) and (orientation:landscape){

  #app{
    padding:12px 30px;
  }

  .carplay-main{
    grid-template-columns:260px 1fr;
    gap:28px;
  }

  #art-wrap{
    width:260px;
  }

  .glass{
    padding:18px;
  }

  #controls{
    margin:15px 0;
  }
}
</style>
</head>

<script src="https://sdk.scdn.co/spotify-player.js"></script>

<script>

/* =====================================================
   SPOTIFY OPSÆTNING
===================================================== */

const CLIENT_ID =
'3ed7b4c2a7ac4b98aba1266ed4f9d824';

const REDIRECT_URI =
window.location.origin +
window.location.pathname;


/* =====================================================
   TILLADELSER
===================================================== */

const SCOPES = [

  'streaming',

  'user-read-email',

  'user-read-private',

  'user-modify-playback-state',

  'user-read-playback-state',

  'user-read-currently-playing',

  'playlist-read-private',

  'playlist-read-collaborative'

].join(' ');


/* =====================================================
   ELEMENTER
===================================================== */

const $ = id =>
document.getElementById(id);


const els = {

  login:$('login'),

  loginBtn:$('login-btn'),

  player:$('player'),

  art:$('art'),

  bg:$('bg'),

  title:$('title'),

  artist:$('artist'),

  bar:$('bar'),

  barFill:$('bar-fill'),

  timeCur:$('time-cur'),

  timeDur:$('time-dur'),

  playPause:$('play-pause'),

  iconPlay:$('icon-play'),

  iconPause:$('icon-pause'),

  btnPrev:$('btn-prev'),

  btnNext:$('btn-next'),

  volSide:$('volume-side'),

  volFill:$('vol-side-fill'),

  status:$('status')

};


/* =====================================================
   PKCE
===================================================== */

function randomString(len){

  const chars =
  'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

  const rnd =
  crypto.getRandomValues(
    new Uint8Array(len)
  );

  let out='';

  for(
    let i=0;
    i<len;
    i++
  ){

    out +=
    chars[
      rnd[i] %
      chars.length
    ];

  }

  return out;
}


async function sha256(x){

  return crypto.subtle.digest(
    'SHA-256',
    new TextEncoder().encode(x)
  );

}


function base64url(buf){

  return btoa(
    String.fromCharCode(
      ...new Uint8Array(buf)
    )
  )
  .replace(/\+/g,'-')
  .replace(/\//g,'_')
  .replace(/=+$/,'');

}


/* =====================================================
   LOGIN
===================================================== */

async function redirectToSpotifyLogin(){

  const verifier =
  randomString(64);

  sessionStorage.setItem(
    'pkce_verifier',
    verifier
  );

  const challenge =
  base64url(
    await sha256(verifier)
  );

  const params =
  new URLSearchParams({

    client_id:CLIENT_ID,

    response_type:'code',

    redirect_uri:REDIRECT_URI,

    scope:SCOPES,

    code_challenge_method:'S256',

    code_challenge:challenge

  });

  window.location =
  'https://accounts.spotify.com/authorize?' +
  params.toString();

}


async function exchangeCode(code){

  const verifier =
  sessionStorage.getItem(
    'pkce_verifier'
  );

  const body =
  new URLSearchParams({

    client_id:CLIENT_ID,

    grant_type:
    'authorization_code',

    code:code,

    redirect_uri:
    REDIRECT_URI,

    code_verifier:
    verifier

  });

  const response =
  await fetch(
    'https://accounts.spotify.com/api/token',
    {

      method:'POST',

      headers:{
        'Content-Type':
        'application/x-www-form-urlencoded'
      },

      body:body

    }
  );

  if(!response.ok){

    throw new Error(
      'Token exchange fejlede'
    );

  }

  return response.json();

}


/* =====================================================
   TOKEN
===================================================== */

function storeTokens(data){

  localStorage.setItem(
    'access_token',
    data.access_token
  );

  localStorage.setItem(
    'expires_at',

    String(
      Date.now() +
      (data.expires_in - 60) *
      1000
    )
  );

  if(data.refresh_token){

    localStorage.setItem(
      'refresh_token',
      data.refresh_token
    );

  }

}


async function refreshToken(){

  const refreshToken =
  localStorage.getItem(
    'refresh_token'
  );

  if(!refreshToken)
    return null;


  const body =
  new URLSearchParams({

    client_id:CLIENT_ID,

    grant_type:
    'refresh_token',

    refresh_token:
    refreshToken

  });


  const response =
  await fetch(
    'https://accounts.spotify.com/api/token',
    {

      method:'POST',

      headers:{
        'Content-Type':
        'application/x-www-form-urlencoded'
      },

      body:body

    }
  );


  if(!response.ok)
    return null;


  const data =
  await response.json();


  storeTokens(data);


  return data.access_token;

}


async function getToken(){

  const expires =
  Number(
    localStorage.getItem(
      'expires_at'
    ) || 0
  );


  if(
    Date.now() <
    expires
  ){

    return localStorage.getItem(
      'access_token'
    );

  }


  return refreshToken();

}


/* =====================================================
   WEB PLAYBACK
===================================================== */

let spotifyPlayer =
null;

let currentDeviceId =
null;

let position = 0;

let duration = 0;

let paused = true;

let ticker = null;

let currentTrackId =
null;


function bootPlayer(){

  window.onSpotifyWebPlaybackSDKReady =
  () => {

    spotifyPlayer =
    new Spotify.Player({

      name:
      'Højtaler-skærm',

      getOAuthToken:
      callback =>
      getToken().then(callback),

      volume:.6

    });


    spotifyPlayer.addListener(
      'ready',

      ({device_id}) => {

        currentDeviceId =
        device_id;

        els.status.textContent =
        'Klar';

        transferPlayback();

      }
    );


    spotifyPlayer.addListener(
      'not_ready',

      () => {

        els.status.textContent =
        'Enhed offline';

      }
    );


    spotifyPlayer.addListener(
      'initialization_error',

      ({message}) => {

        els.status.textContent =
        'Fejl: ' + message;

      }
    );


    spotifyPlayer.addListener(
      'authentication_error',

      ({message}) => {

        els.status.textContent =
        'Login-fejl: ' + message;

      }
    );


    spotifyPlayer.addListener(
      'account_error',

      () => {

        els.status.textContent =
        'Kræver Spotify Premium';

      }
    );


    spotifyPlayer.addListener(
      'player_state_changed',

      state => {

        if(!state)
          return;

        updatePlayer(state);

      }
    );


    spotifyPlayer.connect();

  };


  if(window.Spotify){

    window.onSpotifyWebPlaybackSDKReady();

  }

}


/* =====================================================
   TRANSFER
===================================================== */

async function transferPlayback(){

  const token =
  await getToken();

  if(
    !token ||
    !currentDeviceId
  )
    return;


  await fetch(
    'https://api.spotify.com/v1/me/player',
    {

      method:'PUT',

      headers:{

        Authorization:
        'Bearer ' + token,

        'Content-Type':
        'application/json'

      },

      body:JSON.stringify({

        device_ids:[
          currentDeviceId
        ],

        play:false

      })

    }
  ).catch(()=>{});

}


/* =====================================================
   PLAYER STATE
===================================================== */

function updatePlayer(state){

  const track =
  state.track_window.current_track;


  if(!track)
    return;


  currentTrackId =
  track.id;


  paused =
  state.paused;


  position =
  state.position;


  duration =
  state.duration;


  els.title.textContent =
  track.name;


  els.artist.textContent =
  track.artists
  .map(a=>a.name)
  .join(', ');


  const artwork =
  track.album?.images?.[0]?.url ||
  '';


  if(artwork){

    els.art.src =
    artwork;

    els.bg.style.backgroundImage =
    `url("${artwork}")`;

  }


  els.iconPlay.style.display =
  paused ?
  'block' :
  'none';


  els.iconPause.style.display =
  paused ?
  'none' :
  'block';


  els.volFill.style.height =
  Math.round(
    state.device?.volume_percent ??
    60
  ) + '%';


  updateProgress();

  restartTicker();

  updateTrackHighlight();

}


/* =====================================================
   PROGRESS
===================================================== */

function restartTicker(){

  clearInterval(ticker);


  if(paused)
    return;


  const start =
  Date.now();

  const base =
  position;


  ticker =
  setInterval(()=>{

    position =
    Math.min(
      duration,
      base +
      Date.now() -
      start
    );


    updateProgress();

  },250);

}


function formatTime(ms){

  const seconds =
  Math.floor(ms / 1000);

  const minutes =
  Math.floor(seconds / 60);

  const remaining =
  seconds % 60;


  return (

    minutes +
    ':' +
    (
      remaining < 10
      ? '0'
      : ''
    ) +
    remaining

  );

}


function updateProgress(){

  els.timeCur.textContent =
  formatTime(position);

  els.timeDur.textContent =
  formatTime(duration);


  const percent =
  duration
  ? position / duration * 100
  : 0;


  els.barFill.style.width =
  percent + '%';

}


/* =====================================================
   PLAYER CONTROLS
===================================================== */

els.loginBtn.onclick =
redirectToSpotifyLogin;


els.playPause.onclick =
() => {

  if(spotifyPlayer){

    spotifyPlayer.togglePlay();

  }

};


els.btnPrev.onclick =
() => {

  if(spotifyPlayer){

    spotifyPlayer.previousTrack();

  }

};


els.btnNext.onclick =
() => {

  if(spotifyPlayer){

    spotifyPlayer.nextTrack();

  }

};


/* =====================================================
   SEEK
===================================================== */

els.bar.onclick =
event => {

  const rect =
  els.bar.getBoundingClientRect();


  const percentage =
  Math.max(
    0,
    Math.min(
      1,
      (
        event.clientX -
        rect.left
      ) /
      rect.width
    )
  );


  const newPosition =
  Math.round(
    percentage *
    duration
  );


  if(spotifyPlayer){

    spotifyPlayer.seek(
      newPosition
    );

  }


  position =
  newPosition;


  updateProgress();

};


/* =====================================================
   VOLUME
===================================================== */

let draggingVolume =
false;


function setVolume(clientY){

  const rect =
  els.volSide.getBoundingClientRect();


  const percentage =
  Math.max(
    0,
    Math.min(
      1,
      (
        rect.bottom -
        clientY
      ) /
      rect.height
    )
  );


  els.volFill.style.height =
  percentage * 100 + '%';


  if(spotifyPlayer){

    spotifyPlayer.setVolume(
      percentage
    );

  }

}


els.volSide.addEventListener(
  'pointerdown',
  event => {

    draggingVolume =
    true;

    els.volSide.setPointerCapture(
      event.pointerId
    );

    setVolume(
      event.clientY
    );

  }
);


els.volSide.addEventListener(
  'pointermove',
  event => {

    if(!draggingVolume)
      return;

    setVolume(
      event.clientY
    );

  }
);


els.volSide.addEventListener(
  'pointerup',
  () => {

    draggingVolume =
    false;

  }
);


els.volSide.addEventListener(
  'pointercancel',
  () => {

    draggingVolume =
    false;

  }
);


/* =====================================================
   PLAYLISTS
===================================================== */

const overlay =
$('playlist-overlay');

const grid =
$('playlist-grid');

const trackList =
$('track-list');

const playlistTitle =
$('playlist-title');

const backButton =
$('back-playlists');


$('btn-playlists').onclick =
() => {

  overlay.classList.add(
    'open'
  );

  showPlaylists();

};


$('close-playlists').onclick =
() => {

  overlay.classList.remove(
    'open'
  );

};


overlay.onclick =
event => {

  if(
    event.target ===
    overlay
  ){

    overlay.classList.remove(
      'open'
    );

  }

};


backButton.onclick =
showPlaylists;


let playlistsLoaded =
false;


/* =====================================================
   HENT PLAYLISTER
===================================================== */

async function loadPlaylists(){

  if(playlistsLoaded)
    return;


  const token =
  await getToken();


  grid.innerHTML =
  '<div style="color:#999">Henter playlister…</div>';


  try{

    const response =
    await fetch(
      'https://api.spotify.com/v1/me/playlists?limit=50',
      {

        headers:{
          Authorization:
          'Bearer ' + token
        }

      }
    );


    if(!response.ok){

      throw new Error(
        'Playlist request failed'
      );

    }


    const data =
    await response.json();


    renderPlaylists(
      data.items || []
    );


    playlistsLoaded =
    true;


  }catch(error){

    grid.innerHTML =
    '<div style="color:#999">Kunne ikke hente playlister.</div>';

  }

}


/* =====================================================
   VIS PLAYLISTER
===================================================== */

function showPlaylists(){

  playlistTitle.textContent =
  'Dine playlister';


  backButton.style.display =
  'none';


  grid.style.display =
  'grid';


  trackList.style.display =
  'none';


  loadPlaylists();

}


/* =====================================================
   RENDER PLAYLISTER
===================================================== */

function renderPlaylists(playlists){

  grid.innerHTML =
  '';


  playlists.forEach(
    playlist => {

      const div =
      document.createElement(
        'div'
      );


      div.className =
      'pl-item';


      const image =
      playlist.images?.[0]?.url ||
      '';


      div.innerHTML = `

        <img
          src="${image}"
          alt="">

        <span>
          ${escapeHtml(
            playlist.name
          )}
        </span>

      `;


      div.onclick =
      () => {

        openPlaylist(
          playlist
        );

      };


      grid.appendChild(
        div
      );

    }
  );

}


/* =====================================================
   ÅBN PLAYLIST
===================================================== */

async function openPlaylist(
  playlist
){

  playlistTitle.textContent =
  playlist.name;


  backButton.style.display =
  'flex';


  grid.style.display =
  'none';


  trackList.style.display =
  'flex';


  trackList.innerHTML =
  '<div style="color:#999;padding:12px">Henter sange…</div>';


  const token =
  await getToken();


  try{

    /*
      NY SPOTIFY PLAYLIST API

      /items bruges i stedet for
      det gamle /tracks endpoint.
    */

    const response =
    await fetch(

      `https://api.spotify.com/v1/playlists/${playlist.id}/items?limit=50&additional_types=track`,

      {

        headers:{
          Authorization:
          'Bearer ' + token
        }

      }

    );


    if(!response.ok){

      throw new Error(
        'Kunne ikke hente playlist'
      );

    }


    const data =
    await response.json();


    renderTracks(
      playlist,
      data.items || []
    );


  }catch(error){

    trackList.innerHTML =
    '<div style="color:#999;padding:12px">Kunne ikke hente sangene.</div>';

  }

}


/* =====================================================
   RENDER SANGE
===================================================== */

function renderTracks(
  playlist,
  items
){

  trackList.innerHTML =
  '';


  /* AFSPIL HELE */

  const playAll =
  document.createElement(
    'button'
  );


  playAll.className =
  'play-all-btn';


  playAll.textContent =
  '▶  Afspil hele playlisten';


  playAll.onclick =
  () => {

    playPlaylist(
      playlist.uri
    );

  };


  trackList.appendChild(
    playAll
  );


  /* SANGE */

  items.forEach(
    item => {

      const track =
      item.item ||
      item.track;


      if(
        !track ||
        track.type !==
        'track'
      )
        return;


      const row =
      document.createElement(
        'div'
      );


      row.className =
      'track-row';


      if(
        track.id ===
        currentTrackId
      ){

        row.classList.add(
          'playing'
        );

      }


      row.dataset.trackId =
      track.id;


      const image =
      track.album?.images?.slice(-1)[0]?.url ||
      track.album?.images?.[0]?.url ||
      '';


      const artists =
      track.artists
      .map(
        artist =>
        artist.name
      )
      .join(', ');


      row.innerHTML = `

        <img
          src="${image}"
          alt="">

        <div class="t-meta">

          <span class="t-title">
            ${escapeHtml(
              track.name
            )}
          </span>

          <span class="t-artist">
            ${escapeHtml(
              artists
            )}
          </span>

        </div>

        <div class="track-state">
          ${
            track.id ===
            currentTrackId
            ? '●'
            : ''
          }
        </div>

      `;


      /*
        VIGTIGT:

        Man kan nu trykke direkte
        på sangen.
      */

      row.onclick =
      () => {

        playTrack(
          playlist.uri,
          track.uri
        );

      };


      trackList.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   AFSPIL PLAYLIST
===================================================== */

async function playPlaylist(
  playlistUri
){

  const token =
  await getToken();


  const url =
  'https://api.spotify.com/v1/me/player/play' +

  (
    currentDeviceId
    ? '?device_id=' +
      encodeURIComponent(
        currentDeviceId
      )
    : ''
  );


  try{

    const response =
    await fetch(
      url,
      {

        method:'PUT',

        headers:{

          Authorization:
          'Bearer ' + token,

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          context_uri:
          playlistUri

        })

      }
    );


    if(!response.ok)
      throw new Error();


    overlay.classList.remove(
      'open'
    );


  }catch(error){

    els.status.textContent =
    'Kunne ikke starte playlisten';

  }

}


/* =====================================================
   AFSPIL BESTEMT SANG
===================================================== */

async function playTrack(
  playlistUri,
  trackUri
){

  const token =
  await getToken();


  const url =
  'https://api.spotify.com/v1/me/player/play' +

  (
    currentDeviceId
    ? '?device_id=' +
      encodeURIComponent(
        currentDeviceId
      )
    : ''
  );


  try{

    const response =
    await fetch(
      url,
      {

        method:'PUT',

        headers:{

          Authorization:
          'Bearer ' + token,

          'Content-Type':
          'application/json'

        },

        body:
        JSON.stringify({

          context_uri:
          playlistUri,

          offset:{
            uri:
            trackUri
          },

          position_ms:0

        })

      }
    );


    if(!response.ok)
      throw new Error();


    overlay.classList.remove(
      'open'
    );


  }catch(error){

    els.status.textContent =
    'Kunne ikke starte sangen';

  }

}


/* =====================================================
   MARKER SANGEN DER SPILLER
===================================================== */

function updateTrackHighlight(){

  document
  .querySelectorAll(
    '.track-row'
  )
  .forEach(
    row => {

      const playing =
      row.dataset.trackId ===
      currentTrackId;


      row.classList.toggle(
        'playing',
        playing
      );


      const state =
      row.querySelector(
        '.track-state'
      );


      if(state){

        state.textContent =
        playing
        ? '●'
        : '';

      }

    }
  );

}


/* =====================================================
   HTML SIKKERHED
===================================================== */

function escapeHtml(text){

  return String(text)
  .replace(
    /[&<>"']/g,
    char => {

      return {

        '&':'&amp;',

        '<':'&lt;',

        '>':'&gt;',

        '"':'&quot;',

        "'":'&#039;'

      }[char];

    }
  );

}


/* =====================================================
   FULLSCREEN
===================================================== */

$('btn-fullscreen').onclick =
() => {

  if(
    !document.fullscreenElement
  ){

    document.documentElement
    .requestFullscreen?.();

  }else{

    document
    .exitFullscreen?.();

  }

};


/* =====================================================
   KLOKKEN
===================================================== */

function updateClock(){

  $('clock').textContent =
  new Date()
  .toLocaleTimeString(
    'da-DK',
    {
      hour:'2-digit',
      minute:'2-digit'
    }
  );

}


setInterval(
  updateClock,
  1000
);


updateClock();


/* =====================================================
   START
===================================================== */

(async function init(){

  const params =
  new URLSearchParams(
    window.location.search
  );


  const code =
  params.get('code');


  if(code){

    try{

      const data =
      await exchangeCode(
        code
      );


      storeTokens(
        data
      );


      window.history.replaceState(
        {},
        document.title,
        REDIRECT_URI
      );


    }catch(error){

      els.status.textContent =
      'Login fejlede — prøv igen.';

      return;

    }

  }


  const accessToken =
  await getToken();


  if(!accessToken){

    els.login.style.display =
    'flex';

    els.status.textContent =
    'Ikke logget ind';

    return;

  }


  els.login.style.display =
  'none';


  els.player.style.display =
  'block';


  els.status.textContent =
  'Forbinder til Spotify…';


  bootPlayer();

})();

</script>
