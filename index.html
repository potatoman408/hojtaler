<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Højtaler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: #6b6f76;
    --accent-dim: #35373b;
    --bg: #0a0a0a;
    --fg: #f5f3ee;
    --fg-dim: rgba(245,243,238,0.58);
    --control-alpha: 1;
    --glass-bg: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.10);
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
    --spotify-green: #1DB954;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #bg{
    position:fixed; inset:-15%;
    background-size: cover;
    background-position:center;
    filter: blur(90px) saturate(1.5) brightness(0.5);
    transform: scale(1.2);
    transition: background-image 1.2s var(--ease);
    z-index:0;
  }
  #tint{
    position:fixed; inset:0;
    background: radial-gradient(circle at 50% 32%, transparent 0%, var(--bg) 82%);
    z-index:1;
  }
  #app{
    position:relative; z-index:2;
    height:100%; width:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding: 6vh 6vw;
  }

  /* ---- Login screen ---- */
  #login{
    display:flex; flex-direction:column; align-items:center; gap:28px;
    text-align:center;
  }
  #login h1{
    font-size: clamp(28px, 4vw, 44px);
    font-weight:600; margin:0; letter-spacing:-0.01em;
  }
  #login p{ color:var(--fg-dim); font-size:16px; max-width:420px; margin:0; line-height:1.5;}
  .btn-primary{
    background: var(--fg); color:#111; border:none;
    padding: 16px 34px; border-radius: 999px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px;
    cursor:pointer; letter-spacing:0.01em;
  }

  /* ---- Now playing ---- */
  #player{ display:none; flex-direction:column; align-items:center; width:100%; max-width:520px; }
  #art-wrap{
    position:relative; width:min(58vw, 56vh); height:min(58vw,56vh);
    border-radius: 32px; overflow:hidden;
    box-shadow:
      0 40px 100px -30px rgba(0,0,0,0.65),
      0 10px 40px -10px rgba(0,0,0,0.4),
      0 0 0 1px rgba(255,255,255,0.07);
    transition: box-shadow 0.6s var(--ease);
  }
  #art{ width:100%; height:100%; object-fit:cover; display:block; background:#111; }

  #meta{ margin-top: 34px; text-align:center; width:100%; }
  #title{
    font-size: clamp(20px, 2.6vw, 30px); font-weight:600;
    line-height:1.25; letter-spacing:-0.01em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #artist{
    margin-top:6px; font-size: clamp(14px, 1.6vw, 18px);
    color:var(--fg-dim); font-weight:400;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  #glass-panel{
    width:100%; margin-top:30px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 28px;
    padding: 22px 26px 18px;
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    opacity: var(--control-alpha);
    transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
    transform: translateY(calc((1 - var(--control-alpha)) * 6px));
  }
  #progress-row{
    width:100%; display:flex; align-items:center; gap:12px;
  }
  #time-cur, #time-dur{
    font-family:'Space Mono', monospace; font-size:12px; color:var(--fg-dim);
    width:42px; flex-shrink:0;
  }
  #time-dur{ text-align:right; }
  #bar{
    flex:1; height:5px; background:rgba(255,255,255,0.14);
    border-radius:8px; position:relative; cursor:pointer;
  }
  #bar-fill{
    position:absolute; left:0; top:0; height:100%;
    background: var(--spotify-green); border-radius:8px; width:0%;
    transition: width 0.2s linear;
  }

  #controls{
    display:flex; align-items:center; justify-content:center; gap:34px;
    margin-top: 22px;
  }
  .ctrl-btn{
    background:none; border:none; color:var(--fg); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:10px; opacity:0.9;
    border-radius: 999px;
    transition: opacity 0.25s var(--ease), transform 0.25s var(--ease), background 0.25s var(--ease);
  }
  .ctrl-btn:active{ opacity:0.5; transform: scale(0.9); background: rgba(255,255,255,0.08); }
  #play-pause{
    background: var(--spotify-green);
    color: #06120a;
    width: 62px; height: 62px;
    transform: scale(1);
    box-shadow: 0 10px 24px -8px rgba(29,185,84,0.55);
  }
  #play-pause:active{ transform: scale(0.94); background: var(--spotify-green); }

  #volume-side{
    position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
    width: 48px; height: 42vh; max-height: 320px; min-height: 180px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    display:flex; align-items:flex-end; justify-content:center;
    padding: 14px 0;
    z-index:4; cursor:pointer;
    opacity: var(--control-alpha);
    transition: opacity 0.7s var(--ease);
    touch-action: none;
  }
  #vol-side-fill{
    position:absolute; left:6px; right:6px; bottom:6px;
    height: 50%; border-radius: 999px;
    background: linear-gradient(to top, var(--spotify-green), #7be89a);
    transition: height 0.12s linear;
  }
  #vol-side-icon{
    position:relative; color: var(--fg); opacity:0.9; margin-bottom: 6px;
    pointer-events:none;
  }

  #panel-footer{
    display:flex; align-items:center; justify-content:center;
    margin-top:18px; padding-top:16px;
    border-top: 1px solid var(--glass-border);
  }
  #btn-playlists{
    display:flex; align-items:center; gap:8px;
    background:none; border:none; color:var(--fg-dim); cursor:pointer;
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:500;
    padding:8px 16px; border-radius:999px;
    transition: background 0.25s var(--ease), color 0.25s var(--ease);
  }
  #btn-playlists:active{ background: rgba(255,255,255,0.08); color:var(--fg); }

  /* ---- Playlist overlay ---- */
  #playlist-overlay{
    position:fixed; inset:0; z-index:10;
    background: rgba(6,6,6,0.55);
    backdrop-filter: blur(30px) saturate(1.3);
    -webkit-backdrop-filter: blur(30px) saturate(1.3);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity 0.4s var(--ease);
  }
  #playlist-overlay.open{ opacity:1; pointer-events:auto; }
  #playlist-panel{
    width:100%; max-width:640px; max-height:78vh;
    background: rgba(20,20,20,0.9);
    border: 1px solid var(--glass-border);
    border-radius: 32px 32px 0 0;
    padding: 22px 22px 34px;
    transform: translateY(24px);
    transition: transform 0.45s var(--ease);
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
  }
  #playlist-overlay.open #playlist-panel{ transform: translateY(0); }
  #playlist-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
  }
  #playlist-header h2{ font-size:18px; font-weight:600; margin:0; }
  #close-playlists{
    background: rgba(255,255,255,0.08); border:none; color:var(--fg);
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  #playlist-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap:16px;
  }
  .pl-item{
    cursor:pointer; display:flex; flex-direction:column; gap:8px;
    border-radius:18px; transition: transform 0.2s var(--ease);
  }
  .pl-item:active{ transform: scale(0.95); }
  .pl-item img{
    width:100%; aspect-ratio:1; object-fit:cover; border-radius:16px;
    box-shadow: 0 10px 24px -10px rgba(0,0,0,0.5);
  }
  .pl-item span{
    font-size:13px; font-weight:500; color:var(--fg-dim);
    display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .pl-item.playing span{ color:var(--fg); }

  #status{
    position:fixed; bottom:18px; left:0; width:100%; text-align:center;
    font-family:'Space Mono', monospace; font-size:11px; color:var(--fg-dim);
    letter-spacing:0.02em; z-index:3; opacity:var(--control-alpha); transition:opacity 0.4s ease;
  }

  @media (prefers-color-scheme: light){ }
</style>
</head>
<body>

<div id="bg"></div>
<div id="tint"></div>

<div id="app">
  <div id="login">
    <h1>Din højtaler venter</h1>
    <p>Log ind med Spotify for at gøre denne skærm til afspilningsenhed for højtaleren.</p>
    <button class="btn-primary" id="login-btn">Log ind med Spotify</button>
  </div>

  <div id="player">
    <div id="art-wrap"><img id="art" src="" alt=""></div>
    <div id="meta">
      <div id="title">—</div>
      <div id="artist">—</div>
    </div>

    <div id="glass-panel">
      <div id="progress-row">
        <span id="time-cur">0:00</span>
        <div id="bar"><div id="bar-fill"></div></div>
        <span id="time-dur">0:00</span>
      </div>

      <div id="controls">
        <button class="ctrl-btn" id="btn-prev" aria-label="Forrige">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l10-6v12z"/></svg>
        </button>
        <button class="ctrl-btn" id="play-pause" aria-label="Afspil/pause">
          <svg id="icon-play" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" aria-label="Næste">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4.5 6l10 6-10 6z"/></svg>
        </button>
      </div>

      <div id="panel-footer">
        <button id="btn-playlists">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
          Vælg playliste
        </button>
      </div>
    </div>
  </div>
</div>

<div id="volume-side">
  <div id="vol-side-fill"></div>
  <svg id="vol-side-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>
</div>

<div id="playlist-overlay">
  <div id="playlist-panel">
    <div id="playlist-header">
      <h2>Dine playlister</h2>
      <button id="close-playlists">✕</button>
    </div>
    <div id="playlist-grid"></div>
  </div>
</div>

<div id="status">Forbinder…</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
/* =========================================================
   OPSÆTNING — udfyld disse to linjer efter du har oprettet
   din Spotify-app på developer.spotify.com/dashboard
   ========================================================= */
const CLIENT_ID = '3ed7b4c2a7ac4b98aba1266ed4f9d824';
const REDIRECT_URI = window.location.origin + window.location.pathname; // matcher automatisk denne sides adresse
/* ========================================================= */

const SCOPES = [
  'streaming',
  'user-read-email',
  'user-read-private',
  'user-modify-playback-state',
  'user-read-playback-state',
  'user-read-currently-playing',
  'playlist-read-private',
  'playlist-read-collaborative'
].join(' ');

const els = {
  login: document.getElementById('login'),
  loginBtn: document.getElementById('login-btn'),
  player: document.getElementById('player'),
  art: document.getElementById('art'),
  bg: document.getElementById('bg'),
  title: document.getElementById('title'),
  artist: document.getElementById('artist'),
  bar: document.getElementById('bar'),
  barFill: document.getElementById('bar-fill'),
  timeCur: document.getElementById('time-cur'),
  timeDur: document.getElementById('time-dur'),
  playPause: document.getElementById('play-pause'),
  iconPlay: document.getElementById('icon-play'),
  iconPause: document.getElementById('icon-pause'),
  btnPrev: document.getElementById('btn-prev'),
  btnNext: document.getElementById('btn-next'),
  volSide: document.getElementById('volume-side'),
  volSideFill: document.getElementById('vol-side-fill'),
  status: document.getElementById('status'),
};

/* ---------------- PKCE helpers ---------------- */
function randomString(len){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let out = '';
  const rnd = crypto.getRandomValues(new Uint8Array(len));
  for (let i=0; i<len; i++) out += chars[rnd[i] % chars.length];
  return out;
}
async function sha256(plain){
  const data = new TextEncoder().encode(plain);
  return crypto.subtle.digest('SHA-256', data);
}
function base64urlencode(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function redirectToSpotifyLogin(){
  const verifier = randomString(64);
  sessionStorage.setItem('pkce_verifier', verifier);
  const challenge = base64urlencode(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: 'S256',
    code_challenge: challenge,
  });
  window.location = 'https://accounts.spotify.com/authorize?' + params.toString();
}

async function exchangeCodeForToken(code){
  const verifier = sessionStorage.getItem('pkce_verifier');
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier,
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body,
  });
  if (!res.ok) throw new Error('Token exchange fejlede');
  return res.json();
}

async function refreshAccessToken(){
  const refreshToken = localStorage.getItem('refresh_token');
  if (!refreshToken) return null;
  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: 'refresh_token',
    refresh_token: refreshToken,
  });
  const res = await fetch('https://accounts.spotify.com/api/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body,
  });
  if (!res.ok) return null;
  const data = await res.json();
  storeTokens(data);
  return data.access_token;
}

function storeTokens(data){
  localStorage.setItem('access_token', data.access_token);
  localStorage.setItem('expires_at', String(Date.now() + (data.expires_in - 60) * 1000));
  if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
}

async function getValidAccessToken(){
  const expiresAt = Number(localStorage.getItem('expires_at') || 0);
  if (Date.now() < expiresAt) return localStorage.getItem('access_token');
  return await refreshAccessToken();
}

/* ---------------- Boot sequence ---------------- */
els.loginBtn.addEventListener('click', redirectToSpotifyLogin);

(async function init(){
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');

  if (code) {
    els.status.textContent = 'Logger ind…';
    try {
      const data = await exchangeCodeForToken(code);
      storeTokens(data);
      window.history.replaceState({}, document.title, REDIRECT_URI);
    } catch (e) {
      els.status.textContent = 'Login fejlede — prøv igen.';
      return;
    }
  }

  const token = await getValidAccessToken();
  if (!token) {
    els.login.style.display = 'flex';
    els.status.textContent = 'Ikke logget ind';
    return;
  }

  els.login.style.display = 'none';
  els.player.style.display = 'flex';
  els.status.textContent = 'Forbinder til Spotify…';
  bootPlayer();
})();

/* ---------------- Web Playback SDK ---------------- */
let spotifyPlayer = null;
let currentDeviceId = null;
let localPositionMs = 0;
let localDurationMs = 0;
let isPaused = true;
let tickInterval = null;

function bootPlayer(){
  window.onSpotifyWebPlaybackSDKReady = () => {
    spotifyPlayer = new Spotify.Player({
      name: 'Højtaler-skærm',
      getOAuthToken: cb => { getValidAccessToken().then(cb); },
      volume: 0.6,
    });

    spotifyPlayer.addListener('ready', ({ device_id }) => {
      currentDeviceId = device_id;
      els.status.textContent = 'Klar — vælg denne enhed i Spotify hvis afspilning ikke starter automatisk';
      transferPlaybackHere();
    });

    spotifyPlayer.addListener('not_ready', () => {
      els.status.textContent = 'Enhed offline';
    });

    spotifyPlayer.addListener('initialization_error', ({message}) => { els.status.textContent = 'Fejl: ' + message; });
    spotifyPlayer.addListener('authentication_error', ({message}) => { els.status.textContent = 'Login-fejl: ' + message; });
    spotifyPlayer.addListener('account_error', ({message}) => { els.status.textContent = 'Kræver Spotify Premium'; });

    spotifyPlayer.addListener('player_state_changed', state => {
      if (!state) return;
      updateFromState(state);
      els.status.textContent = '';
    });

    spotifyPlayer.connect();
  };

  if (window.Spotify) window.onSpotifyWebPlaybackSDKReady();
}

async function transferPlaybackHere(){
  const token = await getValidAccessToken();
  try {
    await fetch('https://api.spotify.com/v1/me/player', {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_ids: [currentDeviceId], play: true }),
    });
  } catch (e) { /* stille fejl - bruger kan vælge enheden manuelt i Spotify-appen */ }
}

let lastArtUrl = '';
function updateFromState(state){
  const track = state.track_window.current_track;
  isPaused = state.paused;
  localPositionMs = state.position;
  localDurationMs = state.duration;

  els.title.textContent = track.name;
  els.artist.textContent = track.artists.map(a => a.name).join(', ');

  const artUrl = track.album.images[0]?.url || '';
  if (artUrl && artUrl !== lastArtUrl){
    lastArtUrl = artUrl;
    els.art.src = artUrl;
    els.bg.style.backgroundImage = `url(${artUrl})`;
  }

  els.iconPlay.style.display = isPaused ? 'block' : 'none';
  els.iconPause.style.display = isPaused ? 'none' : 'block';

  els.volSideFill.style.height = Math.round((state.device?.volume_percent ?? 60)) + '%';

  updateProgressUI();
  restartTicker();
}

function restartTicker(){
  clearInterval(tickInterval);
  if (isPaused) return;
  const start = Date.now();
  const base = localPositionMs;
  tickInterval = setInterval(() => {
    localPositionMs = base + (Date.now() - start);
    if (localPositionMs > localDurationMs) localPositionMs = localDurationMs;
    updateProgressUI();
  }, 250);
}

function fmtTime(ms){
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${r < 10 ? '0' : ''}${r}`;
}

function updateProgressUI(){
  els.timeCur.textContent = fmtTime(localPositionMs);
  els.timeDur.textContent = fmtTime(localDurationMs);
  const pct = localDurationMs ? (localPositionMs / localDurationMs) * 100 : 0;
  els.barFill.style.width = pct + '%';
}

/* ---------------- Controls ---------------- */
els.playPause.addEventListener('click', () => spotifyPlayer && spotifyPlayer.togglePlay());
els.btnPrev.addEventListener('click', () => spotifyPlayer && spotifyPlayer.previousTrack());
els.btnNext.addEventListener('click', () => spotifyPlayer && spotifyPlayer.nextTrack());

function seekFromEvent(e, barEl, onSeek){
  const rect = barEl.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  onSeek(ratio);
}
els.bar.addEventListener('click', e => {
  seekFromEvent(e, els.bar, ratio => {
    const ms = Math.round(ratio * localDurationMs);
    spotifyPlayer && spotifyPlayer.seek(ms);
    localPositionMs = ms;
    updateProgressUI();
  });
});
els.volSide.addEventListener('click', e => { if (e.__fromDrag) return; });

function setVolumeFromClientY(clientY){
  const rect = els.volSide.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (rect.bottom - clientY) / rect.height));
  els.volSideFill.style.height = (ratio * 100) + '%';
  spotifyPlayer && spotifyPlayer.setVolume(ratio);
  return ratio;
}

let draggingVolume = false;
els.volSide.addEventListener('pointerdown', e => {
  draggingVolume = true;
  els.volSide.setPointerCapture(e.pointerId);
  setVolumeFromClientY(e.clientY);
  showControls();
});
els.volSide.addEventListener('pointermove', e => {
  if (!draggingVolume) return;
  setVolumeFromClientY(e.clientY);
});
els.volSide.addEventListener('pointerup', () => { draggingVolume = false; });
els.volSide.addEventListener('pointercancel', () => { draggingVolume = false; });

/* ---------------- Playlists ---------------- */
const playlistOverlay = document.getElementById('playlist-overlay');
const playlistGrid = document.getElementById('playlist-grid');
document.getElementById('btn-playlists').addEventListener('click', openPlaylists);
document.getElementById('close-playlists').addEventListener('click', closePlaylists);
playlistOverlay.addEventListener('click', e => { if (e.target === playlistOverlay) closePlaylists(); });

function openPlaylists(){
  playlistOverlay.classList.add('open');
  loadPlaylists();
}
function closePlaylists(){
  playlistOverlay.classList.remove('open');
}

let playlistsLoaded = false;
async function loadPlaylists(){
  if (playlistsLoaded) return;
  const token = await getValidAccessToken();
  playlistGrid.innerHTML = '<span style="color:var(--fg-dim); font-size:14px;">Henter…</span>';
  try {
    const res = await fetch('https://api.spotify.com/v1/me/playlists?limit=50', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (res.status === 401 || res.status === 403) {
      // Gamle tilladelser matcher ikke længere — log ind igen for at opdatere dem
      localStorage.removeItem('access_token');
      localStorage.removeItem('expires_at');
      localStorage.removeItem('refresh_token');
      redirectToSpotifyLogin();
      return;
    }
    const data = await res.json();
    renderPlaylists(data.items || []);
    playlistsLoaded = true;
  } catch (e) {
    playlistGrid.innerHTML = '<span style="color:var(--fg-dim); font-size:14px;">Kunne ikke hente playlister</span>';
  }
}

function renderPlaylists(items){
  playlistGrid.innerHTML = '';
  items.forEach(pl => {
    const img = pl.images?.[0]?.url || '';
    const div = document.createElement('div');
    div.className = 'pl-item';
    div.innerHTML = `<img src="${img}" alt=""><span>${pl.name}</span>`;
    div.addEventListener('click', () => playPlaylist(pl.uri, div));
    playlistGrid.appendChild(div);
  });
}

async function playPlaylist(uri, el){
  document.querySelectorAll('.pl-item.playing').forEach(n => n.classList.remove('playing'));
  el.classList.add('playing');
  const token = await getValidAccessToken();
  try {
    await fetch('https://api.spotify.com/v1/me/player/play' + (currentDeviceId ? '?device_id=' + currentDeviceId : ''), {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ context_uri: uri }),
    });
    closePlaylists();
  } catch (e) {
    els.status.textContent = 'Kunne ikke starte playliste';
  }
}

/* ---------------- Auto-hide controls (ambient screen) ---------------- */
let hideTimer = null;
function showControls(){
  document.documentElement.style.setProperty('--control-alpha', '1');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    document.documentElement.style.setProperty('--control-alpha', '0');
  }, 6000);
}
['touchstart','mousedown','mousemove'].forEach(evt => document.addEventListener(evt, showControls));
showControls();
</script>
