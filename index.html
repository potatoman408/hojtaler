<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speakerfy">
<title>Speakerfy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --green:#1db954;
  --bg:#070707;
  --text:#f5f5f5;
  --muted:rgba(255,255,255,.62);
  --glass:rgba(12,12,12,.72);
  --border:rgba(255,255,255,.10);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:"Space Grotesk",sans-serif;
  touch-action:manipulation;
  overscroll-behavior:none;
}

body{
  min-height:100dvh;
}

button{
  font:inherit;
  color:inherit;
}

#background{
  position:fixed;
  inset:-12%;
  z-index:0;
  background-position:center;
  background-size:cover;
  filter:blur(90px) saturate(1.38) brightness(.36);
  transform:scale(1.22);
  transition:background-image .7s var(--ease);
}

#shade{
  position:fixed;
  inset:0;
  z-index:1;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,255,255,.04),transparent 40%),
    linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.78));
}

#topbar{
  position:fixed;
  top:max(10px,env(safe-area-inset-top));
  left:18px;
  right:68px;
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  opacity:1;
  transform:translateY(0);
  transition:opacity .55s var(--ease),transform .55s var(--ease);
  pointer-events:none;
}

#brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:17px;
  font-weight:700;
  letter-spacing:.2px;
}

#brand-dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 22px rgba(29,185,84,.65);
}

#clock{
  color:var(--muted);
  font:13px "Space Mono",monospace;
}

#app{
  position:relative;
  z-index:2;
  width:100%;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:7vh 6vw 5vh;
}

#login{
  width:min(500px,90vw);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

#login h1{
  margin:0;
  font-size:clamp(30px,5vw,48px);
}

#login p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}

.primary{
  margin-top:4px;
  border:0;
  border-radius:999px;
  background:var(--green);
  color:#06110a;
  padding:15px 30px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
}

#player{
  width:100%;
  max-width:1080px;
  display:none;
  align-items:center;
  justify-content:center;
  gap:clamp(28px,5vw,78px);
  grid-template-columns:minmax(280px,500px) minmax(300px,520px);
  transition:grid-template-columns .6s var(--ease),gap .6s var(--ease);
}

#player.player-grid{
  display:grid;
}

#album-wrap{
  width:min(43vw,58vh);
  height:min(43vw,58vh);
  max-width:500px;
  max-height:500px;
  justify-self:end;
  flex:none;
  overflow:hidden;
  border-radius:30px;
  box-shadow:0 35px 85px rgba(0,0,0,.58);
  transition:transform .6s var(--ease),opacity .55s var(--ease),filter .55s var(--ease),justify-self .6s var(--ease);
}

#album{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#151515;
}

#ui{
  min-width:0;
  max-width:520px;
  opacity:1;
  transform:translateX(0);
  transition:opacity .5s var(--ease),transform .6s var(--ease),max-width .6s var(--ease);
}

#title{
  font-size:clamp(24px,3.2vw,40px);
  font-weight:600;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

#artist{
  margin-top:6px;
  color:var(--muted);
  font-size:18px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

#card{
  margin-top:25px;
  padding:22px 23px 18px;
  border:1px solid var(--border);
  border-radius:27px;
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(1.25);
  -webkit-backdrop-filter:blur(24px) saturate(1.25);
  box-shadow:0 22px 50px rgba(0,0,0,.23);
}

#progress-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.time{
  width:42px;
  color:var(--muted);
  font:11px "Space Mono",monospace;
}

#duration{
  text-align:right;
}

#progress{
  position:relative;
  height:6px;
  flex:1;
  overflow:hidden;
  border-radius:999px;
  background:rgba(255,255,255,.13);
  cursor:pointer;
}

#progress-fill{
  width:0%;
  height:100%;
  border-radius:999px;
  background:var(--green);
}

#controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:34px;
  margin-top:23px;
}

.ctrl{
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:transparent;
  padding:11px;
  border-radius:50%;
  cursor:pointer;
}

.ctrl svg{
  width:27px;
  height:27px;
  fill:currentColor;
}

#play{
  width:66px;
  height:66px;
  padding:0;
  background:var(--green);
  color:#06110a;
  box-shadow:0 10px 30px rgba(29,185,84,.30);
}

#play svg{
  width:31px;
  height:31px;
}

#playlist-button{
  display:block;
  margin:16px auto 0;
  padding:10px 16px;
  border:0;
  border-radius:999px;
  background:transparent;
  color:rgba(255,255,255,.82);
  cursor:pointer;
}

#fullscreen{
  position:fixed;
  top:max(10px,env(safe-area-inset-top));
  right:16px;
  z-index:12;
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:50%;
  background:rgba(19,19,19,.72);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity .55s var(--ease),transform .55s var(--ease);
}

#fullscreen svg{
  width:20px;
  height:20px;
  fill:currentColor;
}

#volume{
  position:fixed;
  right:8px;
  top:50%;
  z-index:9;
  width:44px;
  height:240px;
  max-height:36vh;
  min-height:160px;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  touch-action:none;
  opacity:1;
  transition:opacity .55s var(--ease),transform .55s var(--ease);
}

#volume-icon{
  width:18px;
  height:18px;
  fill:rgba(255,255,255,.74);
  flex:none;
}

#volume-track{
  position:relative;
  width:6px;
  flex:1;
  border-radius:999px;
  background:rgba(255,255,255,.11);
  overflow:visible;
}

#volume-fill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:60%;
  border-radius:999px;
  background:var(--green);
}

#volume-fill::after{
  content:"";
  position:absolute;
  top:-6px;
  left:50%;
  width:15px;
  height:15px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.35);
  transform:translateX(-50%);
}

body.idle #topbar,
body.idle #ui,
body.idle #fullscreen,
body.idle #volume{
  opacity:0;
  pointer-events:none;
}

body.idle #topbar{
  transform:translateY(-10px);
}

body.idle #ui{
  transform:translateX(40px);
  max-width:0;
  overflow:hidden;
}

body.idle #fullscreen{
  transform:scale(.92);
}

body.idle #volume{
  transform:translateY(-50%) translateX(12px);
}

body.idle #player{
  gap:0;
  grid-template-columns:minmax(280px,540px) 0px;
}

body.idle #album-wrap{
  justify-self:center;
  transform:scale(1.13);
  filter:saturate(1.08);
}

#status-bottom{
  position:fixed;
  left:50%;
  bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:6;
  transform:translateX(-50%);
  color:var(--muted);
  font:11px "Space Mono",monospace;
  opacity:.75;
  pointer-events:none;
}

#overlay{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:flex-end;
  background:rgba(0,0,0,.70);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  opacity:0;
  pointer-events:none;
  transition:opacity .28s var(--ease);
}

#overlay.open{
  opacity:1;
  pointer-events:auto;
}

#panel{
  width:100%;
  max-width:820px;
  height:84dvh;
  margin:0 auto;
  padding:18px 22px calc(25px + env(safe-area-inset-bottom));
  overflow-y:auto;
  background:rgba(18,18,18,.97);
  border:1px solid var(--border);
  border-bottom:0;
  border-radius:29px 29px 0 0;
  transform:translateY(28px);
  transition:transform .32s var(--ease);
}

#overlay.open #panel{
  transform:translateY(0);
}

#panel-head{
  position:sticky;
  top:-18px;
  z-index:3;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0 16px;
  background:rgba(18,18,18,.97);
}

#panel-title{
  flex:1;
  margin:0;
  font-size:21px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.round{
  width:40px;
  height:40px;
  flex:none;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  cursor:pointer;
}

#playlist-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:18px;
}

.playlist{
  min-width:0;
  cursor:pointer;
}

.playlist img{
  display:block;
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:18px;
  background:#242424;
}

.playlist-name{
  margin-top:8px;
  font-size:14px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

#track-list{
  display:none;
  flex-direction:column;
  gap:3px;
}

.play-all{
  align-self:flex-start;
  margin-bottom:9px;
  padding:11px 18px;
  border:0;
  border-radius:999px;
  background:var(--green);
  color:#06110a;
  font-weight:700;
  cursor:pointer;
}

.track{
  display:flex;
  align-items:center;
  gap:12px;
  min-height:68px;
  padding:9px 8px;
  border-radius:14px;
  cursor:pointer;
}

.track:hover,
.track:active{
  background:rgba(255,255,255,.075);
}

.track img{
  width:50px;
  height:50px;
  flex:none;
  border-radius:9px;
  object-fit:cover;
  background:#242424;
}

.track-number{
  width:24px;
  flex:none;
  text-align:center;
  color:var(--muted);
  font:12px "Space Mono",monospace;
}

.track-meta{
  min-width:0;
  flex:1;
}

.track-title,
.track-artist{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.track-title{
  font-size:15px;
  font-weight:500;
}

.track-artist{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}

#mobile-fullscreen-help{
  position:fixed;
  left:50%;
  bottom:calc(18px + env(safe-area-inset-bottom));
  z-index:60;
  width:min(520px,calc(100vw - 28px));
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:18px;
  background:rgba(20,20,20,.94);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  transition:.25s var(--ease);
  text-align:center;
  font-size:13px;
  color:rgba(255,255,255,.86);
}

#mobile-fullscreen-help.show{
  opacity:1;
  transform:translate(-50%,0);
}

body.mobile-fill{
  position:fixed;
  inset:0;
  width:100vw;
  height:100dvh;
  overflow:hidden;
}

@media(max-width:700px){
  #topbar{
    right:74px;
  }

  #app{
    padding:66px 24px 26px;
  }

  #player{
    max-width:520px;
    grid-template-columns:1fr;
    gap:20px;
  }

  #album-wrap{
    width:min(70vw,350px);
    height:min(70vw,350px);
    justify-self:center;
  }

  #ui{
    width:100%;
    max-width:none;
  }

  #title,
  #artist{
    text-align:center;
  }

  #title{
    font-size:24px;
  }

  #artist{
    font-size:15px;
  }

  #card{
    margin-top:17px;
    padding:17px 18px 15px;
  }

  #volume{
    right:2px;
    height:29vh;
    min-height:130px;
  }

  body.idle #player{
    grid-template-columns:1fr;
  }

  body.idle #ui{
    transform:translateY(12px);
    max-width:none;
  }

  body.idle #album-wrap{
    transform:scale(1.10);
  }

  #playlist-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  #status-bottom{
    display:none;
  }
}

@media(max-height:600px) and (orientation:landscape){
  #app{
    padding:56px 7vw 20px;
  }

  #player{
    gap:5vw;
    grid-template-columns:minmax(220px,420px) minmax(260px,520px);
  }

  #album-wrap{
    width:min(41vw,65vh);
    height:min(41vw,65vh);
    border-radius:22px;
  }

  #card{
    margin-top:15px;
    padding:14px 18px 12px;
  }

  #controls{
    margin-top:14px;
  }

  #play{
    width:56px;
    height:56px;
  }
}
</style>
</head>

<body>
<div id="background"></div>
<div id="shade"></div>

<div id="topbar">
  <div id="brand"><span id="brand-dot"></span>Speakerfy</div>
  <div id="clock">--:--</div>
</div>

<div id="app">
  <div id="login">
    <h1>Speakerfy</h1>
    <p>Log ind med Spotify for at bruge din højtaler som touchscreen-afspiller.</p>
    <button class="primary" id="login-button">Log ind med Spotify</button>
  </div>

  <div id="player">
    <div id="album-wrap">
      <img id="album" alt="Album cover">
    </div>

    <div id="ui">
      <div id="title">—</div>
      <div id="artist">—</div>

      <div id="card">
        <div id="progress-row">
          <span class="time" id="current">0:00</span>
          <div id="progress"><div id="progress-fill"></div></div>
          <span class="time" id="duration">0:00</span>
        </div>

        <div id="controls">
          <button class="ctrl" id="previous" aria-label="Forrige sang">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l10-6v12z"/></svg>
          </button>

          <button class="ctrl" id="play" aria-label="Afspil eller pause">
            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>

          <button class="ctrl" id="next" aria-label="Næste sang">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4.5 6l10 6-10 6z"/></svg>
          </button>
        </div>

        <button id="playlist-button">☰ &nbsp; Vælg playliste</button>
      </div>
    </div>
  </div>
</div>

<div id="volume">
  <svg id="volume-icon" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12z"/></svg>
  <div id="volume-track">
    <div id="volume-fill"></div>
  </div>
</div>

<button id="fullscreen" aria-label="Fuld skærm">
  <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zm-3-12v2h3v3h2V5h-5z"/></svg>
</button>

<div id="status-bottom"></div>

<div id="overlay">
  <div id="panel">
    <div id="panel-head">
      <button class="round" id="back" style="display:none" aria-label="Tilbage">‹</button>
      <h2 id="panel-title">Dine playlister</h2>
      <button class="round" id="close" aria-label="Luk">✕</button>
    </div>
    <div id="playlist-grid"></div>
    <div id="track-list"></div>
  </div>
</div>

<div id="mobile-fullscreen-help"></div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
const CLIENT_ID = "3ed7b4c2a7ac4b98aba1266ed4f9d824";
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = [
  "streaming",
  "user-read-email",
  "user-read-private",
  "user-modify-playback-state",
  "user-read-playback-state",
  "user-read-currently-playing",
  "playlist-read-private",
  "playlist-read-collaborative"
].join(" ");

const $ = id => document.getElementById(id);

const el = {
  login: $("login"),
  loginButton: $("login-button"),
  player: $("player"),
  album: $("album"),
  bg: $("background"),
  title: $("title"),
  artist: $("artist"),
  current: $("current"),
  duration: $("duration"),
  progress: $("progress"),
  progressFill: $("progress-fill"),
  play: $("play"),
  playIcon: $("play-icon"),
  pauseIcon: $("pause-icon"),
  previous: $("previous"),
  next: $("next"),
  clock: $("clock"),
  statusBottom: $("status-bottom"),
  volume: $("volume"),
  volumeFill: $("volume-fill"),
  overlay: $("overlay"),
  panelTitle: $("panel-title"),
  grid: $("playlist-grid"),
  tracks: $("track-list"),
  back: $("back"),
  fullscreen: $("fullscreen"),
  fullscreenHelp: $("mobile-fullscreen-help")
};

function setStatus(text){
  el.statusBottom.textContent = text || "";
}

function updateClock(){
  el.clock.textContent = new Date().toLocaleTimeString("da-DK", {
    hour: "2-digit",
    minute: "2-digit"
  });
}
setInterval(updateClock, 1000);
updateClock();

function randomString(length){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  const values = crypto.getRandomValues(new Uint8Array(length));
  return [...values].map(v => chars[v % chars.length]).join("");
}

async function sha256(text){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
}

function base64url(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}

async function startLogin(){
  const verifier = randomString(64);
  sessionStorage.setItem("speakerfy_pkce_verifier", verifier);

  const challenge = base64url(await sha256(verifier));
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: "code",
    redirect_uri: REDIRECT_URI,
    scope: SCOPES,
    code_challenge_method: "S256",
    code_challenge: challenge
  });

  location.href = "https://accounts.spotify.com/authorize?" + params;
}

el.loginButton.addEventListener("click", startLogin);

async function exchangeCode(code){
  const verifier = sessionStorage.getItem("speakerfy_pkce_verifier");

  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "authorization_code",
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });

  const response = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: {"Content-Type":"application/x-www-form-urlencoded"},
    body
  });

  if(!response.ok) throw new Error("Kunne ikke logge ind");
  return response.json();
}

function saveToken(data){
  localStorage.setItem("speakerfy_access_token", data.access_token);
  localStorage.setItem("speakerfy_expires_at", String(Date.now() + (data.expires_in - 60) * 1000));
  if(data.refresh_token){
    localStorage.setItem("speakerfy_refresh_token", data.refresh_token);
  }
}

async function refreshToken(){
  const refresh = localStorage.getItem("speakerfy_refresh_token");
  if(!refresh) return null;

  const body = new URLSearchParams({
    client_id: CLIENT_ID,
    grant_type: "refresh_token",
    refresh_token: refresh
  });

  const response = await fetch("https://accounts.spotify.com/api/token", {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body
  });

  if(!response.ok) return null;

  const data = await response.json();
  saveToken(data);
  return data.access_token;
}

async function getToken(){
  const expiresAt = Number(localStorage.getItem("speakerfy_expires_at") || 0);
  if(Date.now() < expiresAt){
    return localStorage.getItem("speakerfy_access_token");
  }
  return refreshToken();
}

async function spotifyFetch(url, options = {}, retry = true){
  const token = await getToken();
  if(!token) throw new Error("Ikke logget ind");

  const headers = new Headers(options.headers || {});
  headers.set("Authorization", "Bearer " + token);

  const response = await fetch(url, {...options, headers});

  if(response.status === 401 && retry){
    const newToken = await refreshToken();
    if(newToken) return spotifyFetch(url, options, false);
  }

  return response;
}

let spotifyPlayer = null;
let deviceId = null;
let position = 0;
let duration = 0;
let progressTimer = null;
let currentArt = "";

function setupSpotify(){
  const start = () => {
    if(spotifyPlayer) return;

    spotifyPlayer = new Spotify.Player({
      name:"Speakerfy",
      getOAuthToken: callback => getToken().then(callback),
      volume:.6
    });

    spotifyPlayer.addListener("ready", ({device_id}) => {
      deviceId = device_id;
      setStatus("Speakerfy klar");
      transferPlayback();
    });

    spotifyPlayer.addListener("not_ready", () => {
      setStatus("Speakerfy offline");
    });

    spotifyPlayer.addListener("initialization_error", ({message}) => {
      setStatus("Fejl: " + message);
    });

    spotifyPlayer.addListener("authentication_error", ({message}) => {
      setStatus("Login-fejl: " + message);
    });

    spotifyPlayer.addListener("account_error", () => {
      setStatus("Spotify Premium kræves");
    });

    spotifyPlayer.addListener("player_state_changed", state => {
      if(state) updatePlayer(state);
    });

    spotifyPlayer.connect();
  };

  if(window.Spotify){
    start();
  }else{
    window.onSpotifyWebPlaybackSDKReady = start;
  }
}

async function transferPlayback(){
  if(!deviceId) return;

  await spotifyFetch("https://api.spotify.com/v1/me/player", {
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      device_ids:[deviceId],
      play:false
    })
  });
}

function updatePlayer(state){
  const track = state.track_window.current_track;
  if(!track) return;

  position = state.position;
  duration = state.duration;

  el.title.textContent = track.name;
  el.artist.textContent = track.artists.map(a => a.name).join(", ");

  const art = track.album.images?.[0]?.url || "";
  if(art && art !== currentArt){
    currentArt = art;
    el.album.src = art;
    el.bg.style.backgroundImage = `url("${art}")`;
  }

  el.playIcon.style.display = state.paused ? "block" : "none";
  el.pauseIcon.style.display = state.paused ? "none" : "block";

  const volumePercent = state.device?.volume_percent;
  if(typeof volumePercent === "number"){
    el.volumeFill.style.height = volumePercent + "%";
  }

  updateProgress();

  clearInterval(progressTimer);

  if(!state.paused){
    const startPosition = position;
    const startedAt = Date.now();

    progressTimer = setInterval(() => {
      position = Math.min(duration, startPosition + (Date.now() - startedAt));
      updateProgress();
    }, 250);
  }
}

function formatTime(ms){
  const seconds = Math.max(0, Math.floor(ms / 1000));
  const minutes = Math.floor(seconds / 60);
  return minutes + ":" + String(seconds % 60).padStart(2,"0");
}

function updateProgress(){
  el.current.textContent = formatTime(position);
  el.duration.textContent = formatTime(duration);
  el.progressFill.style.width = (duration ? (position / duration) * 100 : 0) + "%";
}

el.play.addEventListener("click", () => spotifyPlayer?.togglePlay());
el.previous.addEventListener("click", () => spotifyPlayer?.previousTrack());
el.next.addEventListener("click", () => spotifyPlayer?.nextTrack());

el.progress.addEventListener("click", event => {
  if(!duration) return;
  const rect = el.progress.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
  spotifyPlayer?.seek(Math.round(ratio * duration));
});

let draggingVolume = false;

el.volume.addEventListener("pointerdown", event => {
  draggingVolume = true;
  el.volume.setPointerCapture?.(event.pointerId);
  setVolumeFromY(event.clientY);
});

el.volume.addEventListener("pointermove", event => {
  if(draggingVolume) setVolumeFromY(event.clientY);
});

el.volume.addEventListener("pointerup", () => {
  draggingVolume = false;
});

el.volume.addEventListener("pointercancel", () => {
  draggingVolume = false;
});

function setVolumeFromY(y){
  const track = $("volume-track");
  const rect = track.getBoundingClientRect();
  const value = Math.max(0, Math.min(1, (rect.bottom - y) / rect.height));
  el.volumeFill.style.height = (value * 100) + "%";
  spotifyPlayer?.setVolume(value);
}

/* Fade efter 6 sekunder */
let idleTimer = null;
const IDLE_DELAY = 6000;

function wakeScreen(){
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);

  if(!el.overlay.classList.contains("open")){
    idleTimer = setTimeout(() => {
      document.body.classList.add("idle");
    }, IDLE_DELAY);
  }
}

[
  "pointerdown",
  "pointermove",
  "touchstart",
  "click",
  "keydown"
].forEach(eventName => {
  window.addEventListener(eventName, wakeScreen, {passive:true});
});

wakeScreen();

/* Playlister */
$("playlist-button").addEventListener("click", () => {
  el.overlay.classList.add("open");
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  showPlaylists();
});

$("close").addEventListener("click", () => {
  el.overlay.classList.remove("open");
  wakeScreen();
});

el.overlay.addEventListener("click", event => {
  if(event.target === el.overlay){
    el.overlay.classList.remove("open");
    wakeScreen();
  }
});

el.back.addEventListener("click", showPlaylists);

let playlistsLoaded = false;

function escapeHtml(text){
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

async function showPlaylists(){
  el.panelTitle.textContent = "Dine playlister";
  el.back.style.display = "none";
  el.grid.style.display = "grid";
  el.tracks.style.display = "none";

  if(playlistsLoaded) return;

  el.grid.innerHTML = "<p>Henter playlister…</p>";

  try{
    const response = await spotifyFetch("https://api.spotify.com/v1/me/playlists?limit=50");
    if(!response.ok) throw new Error();

    const data = await response.json();
    el.grid.innerHTML = "";
    playlistsLoaded = true;

    if(!data.items?.length){
      el.grid.innerHTML = "<p>Ingen playlister fundet.</p>";
      return;
    }

    data.items.forEach(playlist => {
      const item = document.createElement("div");
      item.className = "playlist";

      item.innerHTML = `
        <img src="${playlist.images?.[0]?.url || ""}" alt="">
        <div class="playlist-name">${escapeHtml(playlist.name)}</div>
      `;

      item.addEventListener("click", () => openPlaylist(playlist));
      el.grid.appendChild(item);
    });

  }catch{
    el.grid.innerHTML = "<p>Kunne ikke hente playlister.</p>";
  }
}

async function openPlaylist(playlist){
  el.panelTitle.textContent = playlist.name;
  el.back.style.display = "block";
  el.grid.style.display = "none";
  el.tracks.style.display = "flex";
  el.tracks.innerHTML = "<p>Henter sange…</p>";

  try{
    const response = await spotifyFetch(
      `https://api.spotify.com/v1/playlists/${playlist.id}/items?limit=100&additional_types=track`
    );

    if(!response.ok) throw new Error();

    const data = await response.json();
    el.tracks.innerHTML = "";

    const playAll = document.createElement("button");
    playAll.className = "play-all";
    playAll.textContent = "▶ Afspil hele playlisten";
    playAll.addEventListener("click", () => playContext(playlist.uri));
    el.tracks.appendChild(playAll);

    const trackItems = (data.items || []).map(item => item.track || item.item).filter(track => track && track.type === "track");

    if(!trackItems.length){
      const message = document.createElement("p");
      message.textContent = "Ingen sange fundet i den playliste.";
      el.tracks.appendChild(message);
      return;
    }

    trackItems.forEach((track,index) => {
      const row = document.createElement("div");
      row.className = "track";

      row.innerHTML = `
        <span class="track-number">${index + 1}</span>
        <img src="${track.album?.images?.slice(-1)[0]?.url || track.album?.images?.[0]?.url || ""}" alt="">
        <div class="track-meta">
          <span class="track-title">${escapeHtml(track.name)}</span>
          <span class="track-artist">${escapeHtml(track.artists.map(a => a.name).join(", "))}</span>
        </div>
      `;

      row.addEventListener("click", () => playContext(playlist.uri, track.uri));
      el.tracks.appendChild(row);
    });

  }catch{
    el.tracks.innerHTML = "<p>Kunne ikke hente sangene.</p>";
  }
}

async function playContext(contextUri, trackUri){
  if(!deviceId){
    setStatus("Speakerfy er ikke klar endnu");
    return;
  }

  const body = {context_uri:contextUri};
  if(trackUri) body.offset = {uri:trackUri};

  const response = await spotifyFetch(
    "https://api.spotify.com/v1/me/player/play?device_id=" + encodeURIComponent(deviceId),
    {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    }
  );

  if(response.ok){
    el.overlay.classList.remove("open");
    wakeScreen();
  }else{
    setStatus("Kunne ikke starte sangen");
  }
}

/* Fullscreen PC + mobil */
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

async function enterFullscreen(){
  const root = document.documentElement;

  try{
    if(root.requestFullscreen){
      await root.requestFullscreen({navigationUI:"hide"});
      return true;
    }
    if(root.webkitRequestFullscreen){
      root.webkitRequestFullscreen();
      return true;
    }
  }catch(e){}

  return false;
}

async function exitFullscreen(){
  try{
    if(document.exitFullscreen){
      await document.exitFullscreen();
      return;
    }
    if(document.webkitExitFullscreen){
      document.webkitExitFullscreen();
      return;
    }
  }catch(e){}
}

function showFullscreenHelp(message){
  el.fullscreenHelp.textContent = message;
  el.fullscreenHelp.classList.add("show");
  clearTimeout(showFullscreenHelp.timer);
  showFullscreenHelp.timer = setTimeout(() => {
    el.fullscreenHelp.classList.remove("show");
  }, 4500);
}

el.fullscreen.addEventListener("click", async event => {
  event.stopPropagation();
  wakeScreen();

  if(isFullscreen()){
    await exitFullscreen();
    document.body.classList.remove("mobile-fill");
    return;
  }

  const success = await enterFullscreen();

  if(!success){
    document.body.classList.toggle("mobile-fill");

    const isiPhone = /iPhone|iPod/i.test(navigator.userAgent);
    const isiPad = /iPad/i.test(navigator.userAgent);

    if(isiPhone || isiPad){
      showFullscreenHelp("På iPhone/iPad: vælg Del → Føj til hjemmeskærm og åbn Speakerfy derfra for bedst fuldskærm.");
    }else{
      showFullscreenHelp("Browseren blokerede normal fullscreen. Speakerfy bruger skærmfyldning i stedet.");
    }
  }
});

document.addEventListener("fullscreenchange", wakeScreen);
document.addEventListener("webkitfullscreenchange", wakeScreen);

/* Start */
(async function init(){
  const params = new URLSearchParams(location.search);
  const code = params.get("code");

  if(code){
    try{
      const data = await exchangeCode(code);
      saveToken(data);
      history.replaceState({}, document.title, REDIRECT_URI);
    }catch{
      setStatus("Spotify-login fejlede");
    }
  }

  const token = await getToken();

  if(token){
    el.login.style.display = "none";
    el.player.style.display = "grid";
    el.player.classList.add("player-grid");
    setStatus("Forbinder…");
    setupSpotify();
  }else{
    setStatus("Ikke logget ind");
  }
})();
</script>
